var GUIDE = "<article class=\"guide\">\n<header class=\"ghead\">\n  <h1>LMS Redesign \u2013 Functional Flow Guide</h1>\n  <p class=\"gsub\">How the training module works across the Admin app, the Web learner app and the Mobile learner app. Updated 15 Oct 2026.</p>\n</header>\n<nav class=\"toc\" aria-label=\"Guide contents\">\n  <a href=\"#g-overview\">Overview</a><a href=\"#g-rules\">Key rules</a><a href=\"#g-admin\">Admin flow</a><a href=\"#g-web\">Web learner flow</a><a href=\"#g-mobile\">Mobile learner flow</a><a href=\"#g-status\">Statuses and labels</a><a href=\"#g-notes\">Notes</a>\n</nav>\n\n<section id=\"g-overview\">\n<h2>Overview</h2>\n<p>The training module is one content structure, <b>Course \u2192 Section \u2192 Videos + one Section Quiz</b>, delivered through three surfaces that share the same rules.</p>\n<div class=\"tw\"><table>\n<thead><tr><th>Surface</th><th>Who uses it</th><th>What it does</th></tr></thead>\n<tbody>\n<tr><td>Admin app</td><td>Training admins</td><td>Create courses, sections, videos and quizzes</td></tr>\n<tr><td>Web learner app</td><td>Employees on desktop</td><td>Watch courses, take section quizzes, track progress</td></tr>\n<tr><td>Mobile learner app</td><td>Employees in a mobile app</td><td>Same as web, opened from the app's side menu, themed to the host app</td></tr>\n</tbody></table></div>\n<p>Content model:</p>\n<ul>\n<li><b>Course</b>: one per product, for example Schedules, Sales app, Plum POS. Has a name and an Active switch.</li>\n<li><b>Section</b>: an ordered group of videos inside a course, for example Getting started, Scheduling shifts, Report, Settings.</li>\n<li><b>Video</b>: a name, a URL, a sequence number (1 is first) and an Active switch. Belongs to one section.</li>\n<li><b>Section Quiz</b>: optional, one per section. Has questions, answer options, a pass mark and learner rules.</li>\n</ul>\n<p>Difficulty levels and role tabs (Cashier, Manager, Server) were removed from the learner UI. Role filtering, if used, happens in the backend.</p>\n</section>\n\n<section id=\"g-rules\">\n<h2>Key rules</h2>\n<p>These rules apply on web and mobile alike.</p>\n<div class=\"tw\"><table>\n<thead><tr><th>Rule</th><th>Behaviour</th></tr></thead>\n<tbody>\n<tr><td>Video progress</td><td>Saved automatically as the learner watches. Rewind is allowed; skipping ahead is not. A video counts as watched at 100%.</td></tr>\n<tr><td>Auto-advance</td><td>When a video finishes and the section has more videos, the next one loads and starts about 1 second later, with an \"Up next\" message.</td></tr>\n<tr><td>Quiz unlock</td><td>A Section Quiz unlocks only when every video in that section is watched. Until then it shows Locked with \"x of y watched\".</td></tr>\n<tr><td>Pass mark</td><td>Set per quiz (for example 70%). Score = correct answers \u00f7 questions. Best score is kept.</td></tr>\n<tr><td>Section status</td><td>Not Started \u2192 In Progress (any video watched) \u2192 Completed (all videos watched and, if there is a quiz, quiz passed). Coming Soon if it has no videos.</td></tr>\n<tr><td>Course status</td><td>Completed when every section with videos is completed; In Progress once anything is watched; otherwise Not Started.</td></tr>\n<tr><td>Course progress %</td><td>Average watched % across all videos in the course. Shown as &lt;1% when above zero but rounds to 0.</td></tr>\n<tr><td>Section focus</td><td>Opening a course expands the first section that is not completed. When a section is completed, it collapses and the next unfinished section opens.</td></tr>\n<tr><td>Resume</td><td>Continue buttons go to the first partly watched video, else the first unwatched one.</td></tr>\n<tr><td>Correct answers</td><td>After a pass, wrong answers show the correct one. After a fail, correct answers stay hidden so a retake still tests the learner.</td></tr>\n<tr><td>Completed courses (mobile)</td><td>Hidden from Other Courses; \"Show Completed Courses (n)\" brings them back for review.</td></tr>\n<tr><td>Ordering</td><td>Videos follow their sequence number within a section. Sections follow the order set in the admin Curriculum.</td></tr>\n</tbody></table></div>\n</section>\n\n<section id=\"g-admin\">\n<h2>Admin flow</h2>\n<p>Admins build every course in one place: Course list \u2192 Course manager (Curriculum) \u2192 sections, videos and quizzes.</p>\n<ol>\n<li><b>Course list</b>\n  <ul><li>Search and Status filter (All, Active, Inactive).</li>\n  <li>Table: #, Course, Sections and videos, Quizzes, Status, Actions.</li>\n  <li>3-dot Actions menu: <b>Edit this course</b>, <b>View course on frontend</b> (learner preview), <b>Delete course</b> (asks first, lists what will be removed, suggests setting Inactive instead).</li>\n  <li><b>New course</b>: enter a name, then the course manager opens.</li></ul></li>\n<li><b>Course manager</b>\n  <ul><li>Header: name, counts, status, View on frontend, Back to course list.</li>\n  <li>Tabs: <b>Curriculum</b> and <b>Basic info</b> (name and Active switch, saved automatically).</li></ul></li>\n<li><b>Curriculum</b>\n  <ul><li>Toolbar: Add section, Add videos, Add quiz, Sort sections (shows up/down arrows on sections).</li>\n  <li>Each section card: Section n: name, video and quiz counts, + Video, + Quiz, Rename, Delete (warns how many videos and quizzes go with it). Sections open and close.</li>\n  <li>Video rows: sequence box, up/down arrows, Active switch, Edit, Delete. Typing a sequence number moves the video and renumbers the rest (no gaps or duplicates).</li>\n  <li>Quiz rows: name, question count, pass mark, Required and Active badges, Edit quiz, Delete.</li></ul></li>\n<li><b>Add / edit videos</b>\n  <ul><li>Choose the section, then add rows one by one or <b>Paste a list</b> (\"Name, URL\" per line, or two Excel columns), review, and save.</li>\n  <li>Optional sequence per row; empty means add to the end. Missing names and invalid URLs are flagged per row.</li></ul></li>\n<li><b>Quiz builder (3 steps)</b>\n  <ol><li><b>Details</b>: section, quiz name, type, order in the section, description.</li>\n  <li><b>Settings</b>: pass mark; attempts (Unlimited or a limit); time limit (none or minutes); when it unlocks (Any time or After the section videos); switches for Active, Required, Shuffle questions, Shuffle answer options, Show correct answers after submitting, Allow skipping questions.</li>\n  <li><b>Questions &amp; answers</b>: question list on the left, editor on the right. Answer type (one or more correct), points, Active, options with a correct-answer marker, optional image/video link, reorder, duplicate, delete.</li></ol>\n  <ul><li>Next is blocked until a step's required fields are valid. Save is blocked until every question is valid and opens the step and question that need fixing. Unsaved changes are protected when leaving.</li></ul></li>\n</ol>\n</section>\n\n<section id=\"g-web\">\n<h2>Web learner flow</h2>\n<p>The web app takes a learner from My courses to a course page, then into videos and the Section Quiz.</p>\n<ol>\n<li><b>My courses (home)</b>\n  <ul><li>Header panel: overall completion ring, a status bar split into completed, in progress and not started, and up to 3 \"Pick up where you left off\" chips (\"+n more\" if there are more).</li>\n  <li>\"View all my courses\" switches the filter to All and scrolls to the list.</li>\n  <li>Summary tiles: Enrolled courses, In progress, Completed, Quizzes passed.</li>\n  <li>Filters: All, In progress (default), Completed. Search by course name or description. Sort: Recommended, Title A\u2013Z, Highest rated, Most progress.</li>\n  <li>In the All view, Recommended order lists in-progress courses first, then not started, then completed.</li>\n  <li>Every action on a course card (title, cover play button, Start, Continue, Watch again) opens the course page.</li></ul></li>\n<li><b>Course page</b>\n  <ul><li>Top bar: a Back button (top-right) returns to My courses.</li>\n  <li>Header: course name, section and video counts, overall progress and a Continue button that jumps to the next video.</li>\n  <li>Course content: one accordion card per section, colored by status (green = completed, blue = in progress, grey = not started).</li>\n  <li>The first unfinished section is open by default; completed sections collapse and the next opens. \"Expand all / Collapse all\" toggles every section.</li>\n  <li>Each open section lists its videos in sequence order with progress, then its Section Quiz.</li></ul></li>\n<li><b>Video player</b>\n  <ul><li>Top bar: course \u00b7 section label and a <b>Back to Course</b> button (top-right).</li>\n  <li>Play fills the progress bar; course and section progress update as the learner watches.</li>\n  <li>Auto-advance to the next video in the section; Previous and Next buttons for manual moves.</li>\n  <li>Right column: the section's video list (current highlighted) and its Section Quiz panel.</li></ul></li>\n<li><b>Section Quiz</b>\n  <ul><li>Locked until all section videos are watched. Clicking a locked quiz (\"Watch videos first\") opens the first unwatched video.</li>\n  <li>One question at a time with numbered jump buttons and an answered count. Next is blocked until an answer is chosen; Submit sends the learner to any skipped question.</li></ul></li>\n<li><b>Result</b>\n  <ul><li>Score, correct count and pass mark, then each answer marked right or wrong.</li>\n  <li>Pass: Back to course (and optional retake). Fail: Retake quiz or Watch the video again.</li></ul></li>\n</ol>\n</section>\n\n<section id=\"g-mobile\">\n<h2>Mobile learner flow</h2>\n<p>On mobile, the course for the app the learner is signed into comes first, and every other course sits under Other Courses.</p>\n<ol>\n<li><b>Entry</b>\n  <ul><li>Side menu (\u2630) \u2192 My Account \u2192 <b>Training Videos</b>. The menu item shows an \"n In Progress\" count.</li>\n  <li>Colors come from the host app's theme. Schedules uses the blue theme; Sales app and Plum POS use their own.</li></ul></li>\n<li><b>Home \u2013 Courses tab</b>\n  <ul><li><b>Continue Watching</b> card: jumps straight to the next video, preferring the signed-in app's course.</li>\n  <li><b>[App] Training</b> (for example Schedules Training): a featured card in the app's colors with progress, watched counts, a Continue Course button and the section list. The next section to work on is highlighted; tapping a section opens the course with that section expanded.</li>\n  <li><b>Other Courses</b>: highlighted cards for the other products, each with status, progress, video and quiz counts and a Start, Continue or Review button. Tapping the card header opens the course.</li>\n  <li>Completed courses are hidden from Other Courses. \"Show Completed Courses (n)\" shows them again.</li>\n  <li>Search (magnifier in the header) filters courses and matches video titles.</li></ul></li>\n<li><b>Home \u2013 Evaluation tab</b>\n  <ul><li>Section quizzes grouped the same way: the signed-in app first, then Other Courses.</li>\n  <li>Each card shows course and section, pass mark, best score and status: Locked, Ready, Passed or Not Passed.</li>\n  <li>Locked quizzes show \"Watch Videos to Unlock\" and open that section.</li></ul></li>\n<li><b>Course screen</b>\n  <ul><li>Progress summary, then sections as an accordion. The first unfinished section is open by default; completed sections collapse and the next opens.</li>\n  <li>Each section lists its videos with status, then its Section Quiz (lock icon and \"Unlocks after all n videos\" until unlocked).</li>\n  <li>Bottom button: Continue Watching, Start Course or Watch Again.</li></ul></li>\n<li><b>Video screen</b>\n  <ul><li>Dark player with Play/Pause and Fullscreen. Rewind only; progress saves automatically.</li>\n  <li><b>Fullscreen</b>: plays in landscape with its own controls and an Exit Fullscreen button (Esc also exits).</li>\n  <li>\"Up Next in [section]\" list and the Section Quiz card below the player.</li>\n  <li>Auto-advance to the next video. On the last video the button becomes Take the Section Quiz once all videos are watched, otherwise Back to Course.</li></ul></li>\n<li><b>Quiz and result</b>\n  <ul><li>All questions on one scrolling page with a fixed Submit Answers button. Unanswered questions are highlighted on submit.</li>\n  <li>Pass: \"Nice Work, You Passed!\" and a button to continue to the next section. Fail: Try Again or Watch the Videos Again.</li></ul></li>\n</ol>\n</section>\n\n<section id=\"g-status\">\n<h2>Statuses and labels</h2>\n<p>Every status uses the same color on web and mobile.</p>\n<div class=\"tw\"><table>\n<thead><tr><th>Applies to</th><th>Status</th><th>Shown when</th><th>Look</th></tr></thead>\n<tbody>\n<tr><td>Course / section</td><td><span class=\"st s-new\">Not Started</span></td><td>Nothing watched yet</td><td>Grey badge, grey number</td></tr>\n<tr><td>Course / section</td><td><span class=\"st s-prog\">In Progress</span></td><td>At least one video watched, not complete</td><td>Blue badge, blue play icon, blue edge</td></tr>\n<tr><td>Course / section</td><td><span class=\"st s-done\">Completed / Done</span></td><td>All videos watched and section quizzes passed</td><td>Green badge, green tick, green edge</td></tr>\n<tr><td>Section</td><td><span class=\"st s-soon\">Coming Soon</span></td><td>Section has no videos yet</td><td>Dashed outline</td></tr>\n<tr><td>Video</td><td>Not Started / x% Watched / Watched</td><td>Based on watched %</td><td>Grey, blue, green icon</td></tr>\n<tr><td>Section Quiz</td><td><span class=\"st s-new\">Locked</span></td><td>Some section videos not watched</td><td>Grey badge with lock icon</td></tr>\n<tr><td>Section Quiz</td><td><span class=\"st s-prog\">Ready / Start</span></td><td>All section videos watched, not attempted</td><td>Blue badge</td></tr>\n<tr><td>Section Quiz</td><td><span class=\"st s-done\">Passed</span></td><td>Best score at or above pass mark</td><td>Green badge</td></tr>\n<tr><td>Section Quiz</td><td><span class=\"st s-fail\">Not Passed / Retry</ var TITLES = { web: 'Web learner app', mobile: 'Mobile learner app', admin: 'Admin app', guide: 'Functional Flow Guide' };
var cache = {};
function htmlFor(k) {
  if (!cache[k]) {
    var bin = atob(APPS[k]), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    cache[k] = new TextDecoder('utf-8').decode(bytes);
  }
  return cache[k];
}
var home = document.getElementById('home'), view = document.getElementById('view'), back = document.getElementById('back'), gview = document.getElementById('guideview');
gview.innerHTML = GUIDE;
gview.querySelectorAll('.toc a').forEach(function (a) { a.addEventListener('click', function (e) { e.preventDefault(); var el = document.getElementById(a.getAttribute('href').slice(1)); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }); });
function show(k) {
  var old = document.getElementById('frame');
  if (old) old.parentNode.removeChild(old);
  gview.style.display = 'none';
  if (k === 'guide') {
    home.style.display = 'none'; view.style.display = 'none'; gview.style.display = 'block'; back.style.display = 'flex';
    window.scrollTo(0, 0);
    try { document.title = TITLES[k] + ' – LMS Redesign'; } catch (e) {}
    return;
  }
  if (k && APPS[k]) {
    var f = document.createElement('iframe');
    f.id = 'frame'; f.title = TITLES[k];
    f.setAttribute('srcdoc', htmlFor(k));
    view.appendChild(f);
    home.style.display = 'none'; view.style.display = 'block'; back.style.display = 'flex';
    try { document.title = TITLES[k] + ' – LMS Redesign'; } catch (e) {}
  } else {
    view.style.display = 'none'; back.style.display = 'none'; home.style.display = 'flex';
    try { document.title = 'LMS Redesign – Prototypes'; } catch (e) {}
  }
}
document.querySelectorAll('.card').forEach(function (b) { b.addEventListener('click', function () { show(b.getAttribute('data-app')); }); });
back.addEventListener('click', function () { show(null); });
try { var h = (location.hash || '').slice(1); if (APPS[h] || h === 'guide') show(h); } catch (e) {}
</script>
