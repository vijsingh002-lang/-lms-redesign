.fl{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-size:13px;font-weight:600}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#121826;color:#fff;padding:12px 16px;border-radius:10px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:60;font-weight:500}

@media (max-width:720px){.vrow .seqf{max-width:120px}.rail{display:none}.main{padding:18px 14px 40px}.fgrid{grid-template-columns:1fr}.rowh{display:none}.vrow{grid-template-columns:1fr 36px;border:1px solid #E1E5EC;border-radius:10px;padding:10px}.vrow .rnum{display:none}.search{width:100%}}

.sidebtn.on{background:linear-gradient(135deg,#2D6BF0,#7C3AED);color:#fff;box-shadow:0 4px 12px rgba(124,58,237,.35)}
.sidebtn .cnt{margin-left:auto;font-size:12px;background:rgba(255,255,255,.14);padding:1px 8px;border-radius:20px}
.sidetip{margin-top:auto;color:#8592AA;font-size:12.5px;padding:12px;border-top:1px solid rgba(255,255,255,.08);line-height:1.5}
.vidpad{padding-bottom:48px}
.asgcell{display:inline-flex;align-items:center;gap:6px;border:1px solid #C9D7FA;background:#EEF3FE;color:#1F4FD1;border-radius:20px;padding:4px 10px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.asgcell:hover{background:#E0E9FD}
.asgcell.add{background:#fff;border-style:dashed;border-color:#AEB8C7;color:#3D4757}
.asgcell.add:hover{border-color:#1F4FD1;color:#1F4FD1}
@media (max-width:860px){.shell{flex-direction:column}.side{width:100%;flex-direction:row;overflow-x:auto;padding:8px;gap:6px}.sidehd,.sidetip{display:none}.sidebtn{width:auto;white-space:nowrap}}

.filters{display:flex;gap:14px;flex-wrap:wrap;padding:16px;align-items:flex-end;border-bottom:1px solid #EDF0F4}
table.clt{min-width:820px}
.clt td{padding:14px 12px}
.ctitle{border:0;background:transparent;padding:0;font-weight:600;font-size:15px;color:#1F4FD1;cursor:pointer;text-align:left}
.ctitle:hover{text-decoration:underline}
.tfoot{padding:12px 16px;color:#556070;font-size:13px}
.crumbbtn{border:0;background:transparent;color:#1F4FD1;padding:2px 4px;cursor:pointer;font-weight:500;border-radius:4px;font-size:13px}
.crumbbtn:hover{text-decoration:underline}
.mhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 20px}
.mtabs{display:flex;gap:4px 24px;flex-wrap:wrap;padding:0 20px;border-top:1px solid #EDF0F4}
.mtab{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:13px 2px;font-weight:600;color:#556070;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.mtab:hover{color:#121826}
.mtab.on{color:#1F4FD1;border-bottom-color:#1F4FD1}
.ctool{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #C9D7FA;color:#1F4FD1;background:#fff;border-radius:22px;padding:7px 15px;font-weight:600;cursor:pointer;min-height:38px}
.pill:hover{background:#EEF3FE}
.pill.on{background:#1F4FD1;color:#fff;border-color:#1F4FD1}
.sec{background:#EEF2F7;border:1px solid #E1E5EC;border-radius:14px;padding:6px 14px 14px;max-width:1000px;width:100%;margin:0 auto}
.sech{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0}
.sectog{flex:1;min-width:220px;display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;cursor:pointer;padding:6px 0;font-size:15px;flex-wrap:wrap}
.secl{color:#556070;font-weight:500}
.secb{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #E1E5EC;border-radius:10px;padding:10px 12px;flex-wrap:wrap}
.item:hover{border-color:#C6CEDA}
.item .iic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.item .inm{flex:1;min-width:220px}
.item .url{font-size:12.5px;max-width:420px}
.item.quiz{border-color:#DCC2F5;background:#FCF9FF}
.secempty{background:#fff;border:1px dashed #C6CEDA;border-radius:10px;padding:16px;text-align:center;color:#556070;font-size:13.5px}
.sidebtn .cnt{margin-left:auto}
.cltwrap{overflow:visible}
.kebab{width:36px;height:36px;border-radius:50%;border:1px solid #C9D7FA;background:#fff;color:#1F4FD1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.kebab:hover,.kebab.on{background:#EEF3FE;border-color:#1F4FD1}
.menubg{position:fixed;inset:0;z-index:20}
.menu{position:absolute;right:12px;top:calc(100% - 8px);z-index:30;background:#fff;border:1px solid #E1E5EC;border-radius:12px;box-shadow:0 12px 32px rgba(15,30,54,.16);padding:6px;min-width:270px;text-align:left}
.menu.up{top:auto;bottom:calc(100% - 8px)}
.mi{display:flex;align-items:flex-start;gap:10px;width:100%;border:0;background:transparent;border-radius:8px;padding:9px 10px;cursor:pointer;text-align:left;color:#121826}
.mi svg{margin-top:2px;flex:none;color:#556070}
.mi:hover,.mi:focus-visible{background:#F3F5F8}
.mi b{display:block;font-weight:600;font-size:14px}
.mis{display:block;font-size:12.5px;color:#556070}
.mi.danger b,.mi.danger svg{color:#B42318}
.mi.danger:hover{background:#FDECEA}
.msep{height:1px;background:#EDF0F4;margin:4px 6px}
.pvov{padding:24px 16px;align-items:flex-start}
.pvwrap{background:#F3F5F8;border-radius:16px;width:100%;max-width:1080px;overflow:hidden;box-shadow:0 24px 60px rgba(15,30,54,.35);display:flex;flex-direction:column}
.pvbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:linear-gradient(115deg,#1E3A8A,#4F46E5 60%,#8B3FD9);color:#fff;padding:12px 16px;font-size:13.5px}
.pvbtn{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.3)}
.pvbtn:hover{background:rgba(255,255,255,.24)}
.pvbody{padding:22px;display:flex;flex-direction:column;gap:16px}
.pvhero{background:#fff;border:1px solid #E1E5EC;border-radius:14px;padding:20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.pvsec{background:#fff;border:1px solid #E1E5EC;border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.pvsh{display:flex;gap:14px;align-items:center}
.pvnum{width:38px;height:38px;border-radius:50%;background:#EAF0FD;color:#1F4FD1;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.pvlist{list-style:none;margin:0;padding:0;border:1px solid #EDF0F4;border-radius:10px;overflow:hidden}
.pvlist:empty{display:none}
.pvrow{display:flex;align-items:center;gap:12px;padding:11px 14px}
.pvrow+.pvrow{border-top:1px solid #EDF0F4}
.pvrow .num{width:28px;height:28px;border-radius:50%;background:#EEF1F5;color:#3D4757;font-weight:600;font-size:12.5px;display:flex;align-items:center;justify-content:center;flex:none}
.pvquiz{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#F5F8FE;border:1px solid #C9D7FA;border-radius:12px;padding:12px 14px}
@media (max-width:900px){.cltwrap{overflow-x:auto;padding-bottom:180px;margin-bottom:-180px}}
@media (max-width:720px){.item .seqin{width:52px}}

</style>

<style>
html,body{margin:0;min-width:1280px}
.wrap{max-width:1600px !important;width:100%}
.sec{max-width:1400px !important}
.overlay{position:fixed}
</style>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-template" id="dc-src"><div class="ad">
<header class="top">
  <div class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"></path><path d="M6 12v5c3 2 9 2 12 0v-5"></path></svg></div>
  <span class="brand">HubWorks</span>
  <span class="muted" style="color:#AEB9CC;margin-left:6px">Admin</span>
  <button class="logout"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v9M6.3 7.3a8 8 0 1 0 11.4 0"></path></svg>Log out</button>
</header>

<div class="shell">
<nav class="side" aria-label="Learning setup">
  <div class="sidehd">Learning setup</div>
  <button class="sidebtn on" aria-current="page" onClick="{{goList}}">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2Z"></path><path d="M9 7h6"></path></svg>
    Courses
    <span class="cnt">{{navCount}}</span>
  </button>
  <div class="sidetip">Course → Sections → Videos and a quiz. Open a course and use Curriculum to build it.</div>
</nav>

<main class="main">
<sc-if value="{{isList}}" hint-placeholder-val="{{ true }}">
<div class="wrap vidpad">
  <nav class="crumbs" aria-label="Breadcrumb">
    <span>Sales Commission Management</span><span aria-hidden="true">/</span>
    <span aria-current="page" style="color:#121826;font-weight:500">Courses</span>
  </nav>
  <div style="display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap">
    <div style="flex:1;min-width:260px">
      <h1 class="h1">Courses</h1>
      <p class="sub">Build each course from sections. Every section holds its videos and quizzes.</p>
    </div>
    <button class="btn p" onClick="{{newCourse}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      New course
    </button>
  </div>

  <section class="panel" aria-labelledby="cl-h" style="overflow:visible">
    <div class="ph"><h2 class="h2" id="cl-h" style="text-transform:uppercase;letter-spacing:.04em;font-size:13px;color:#3D4757">Course list</h2></div>
    <div class="filters">
      <div class="fl" style="flex:1;min-width:220px">
        <label class="lbl" for="cl-q">Search</label>
        <div class="search" style="width:100%">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#556070" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <input id="cl-q" type="search" placeholder="Course name" value="{{lq}}" onChange="{{onLq}}">
        </div>
      </div>
      <div class="fl" style="width:200px">
        <label class="lbl" for="cl-st">Status</label>
        <select id="cl-st" class="inp" value="{{lstatus}}" onChange="{{onLstatus}}">
          <option value="all">All</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>
    </div>
    <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}"><div class="menubg" onClick="{{closeMenu}}" aria-hidden="true"></div></sc-if>
    <sc-if value="{{hasCourses}}" hint-placeholder-val="{{ true }}">
    <div class="cltwrap">
      <table class="clt">
        <thead>
          <tr>
            <th style="width:48px">#</th>
            <th>Course</th>
            <th>Sections and videos</th>
            <th>Quizzes</th>
            <th>Status</th>
            <th style="text-align:right">Actions</th>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{courseRows}}" as="c" hint-placeholder-count="3">
          <tr>
            <td class="muted">{{c.n}}</td>
            <td>
              <div style="display:flex;align-items:center;gap:12px">
                <span class="mono" style="background:{{c.hue}}" aria-hidden="true">{{c.mono}}</span>
                <span>
                  <button class="ctitle" onClick="{{c.open}}">{{c.name}}</button>
                  <span class="muted" style="display:block">{{c.sub}}</span>
                </span>
              </div>
            </td>
            <td class="muted"><span style="display:block">Sections: <b style="color:#121826">{{c.secN}}</b></span><span style="display:block">Videos: <b style="color:#121826">{{c.vidN}}</b></span></td>
            <td class="muted">Quizzes: <b style="color:#121826">{{c.quizN}}</b></td>
            <td><span class="chip {{c.stCls}}">{{c.status}}</span></td>
            <td style="text-align:right;position:relative">
              <button class="kebab {{c.kebabCls}}" aria-label="Actions for {{c.name}}" aria-haspopup="menu" aria-expanded="{{c.menuExp}}" title="Actions" onClick="{{c.toggleMenu}}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="12" cy="19" r="2"></circle></svg>
              </button>
              <sc-if value="{{c.menuOpen}}" hint-placeholder-val="{{ false }}">
                <div class="menu {{c.menuDir}}" role="menu" aria-label="Actions for {{c.name}}" onKeyDown="{{c.menuKey}}">
                  <button class="mi" role="menuitem" onClick="{{c.edit}}">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4Z"></path><path d="m13.5 6.5 4 4"></path></svg>
                    <span><b>Edit this course</b><span class="mis">Sections, videos and quizzes</span></span>
                  </button>
                  <button class="mi" role="menuitem" onClick="{{c.preview}}">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    <span><b>View course on frontend</b><span class="mis">See it the way learners will</span></span>
                  </button>
                  <div class="msep" role="separator"></div>
                  <button class="mi danger" role="menuitem" onClick="{{c.del}}">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg>
                    <span><b>Delete course</b><span class="mis">Removes its sections, videos and quizzes</span></span>
                  </button>
                </div>
              </sc-if>
            </td>
          </tr>
          </sc-for>
        </tbody>
      </table>
    </div>
    </sc-if>
    <sc-if value="{{noCourses}}" hint-placeholder-val="{{ false }}">
      <div class="empty"><div style="font-weight:600;font-size:16px">No courses match your filters</div><div class="muted">Try another name or set Status to All.</div></div>
    </sc-if>
    <div class="tfoot">{{listFoot}}</div>
  </section>
</div>
</sc-if>

<sc-if value="{{isCourse}}" hint-placeholder-val="{{ false }}">
<div class="wrap vidpad">
  <nav class="crumbs" aria-label="Breadcrumb">
    <button class="crumbbtn" onClick="{{goList}}">Courses</button><span aria-hidden="true">/</span>
    <span aria-current="page" style="color:#121826;font-weight:500">{{cm.name}}</span>
  </nav>

  <section class="panel">
    <div class="mhead">
      <span class="mono" style="background:{{cm.hue}};width:52px;height:52px;font-size:18px" aria-hidden="true">{{cm.mono}}</span>
      <div style="flex:1;min-width:220px">
        <div class="muted" style="text-transform:uppercase;letter-spacing:.05em;font-size:12px;font-weight:600">Course manager</div>
        <h1 style="margin:2px 0 0;font-size:22px;font-weight:700">{{cm.name}}</h1>
        <div class="muted">{{cm.meta}}</div>
      </div>
      <span class="chip {{cm.stCls}}">{{cm.status}}</span>
      <button class="btn s sm" onClick="{{cm.preview}}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        View on frontend
      </button>
      <button class="btn s sm" onClick="{{goList}}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"></path></svg>
        Back to course list
      </button>
    </div>
    <div class="mtabs" role="tablist" aria-label="Course manager">
      <button class="mtab {{cm.currCls}}" role="tab" aria-selected="{{cm.currSel}}" onClick="{{cm.toCurr}}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"></path></svg>
        Curriculum
      </button>
      <button class="mtab {{cm.basicCls}}" role="tab" aria-selected="{{cm.basicSel}}" onClick="{{cm.toBasic}}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
        Basic info
      </button>
    </div>
  </section>

  <sc-if value="{{isCurr}}" hint-placeholder-val="{{ true }}">
    <div class="ctool">
      <button class="pill" onClick="{{addSection}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add section</button>
      <button class="pill" onClick="{{addVideosTop}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add videos</button>
      <button class="pill" onClick="{{addQuizTop}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add quiz</button>
      <button class="pill {{sortCls}}" aria-pressed="{{sortPressed}}" onClick="{{toggleSort}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>{{sortLabel}}</button>
    </div>

    <sc-if value="{{sortMode}}" hint-placeholder-val="{{ false }}">
      <div class="note" style="margin:0 auto;max-width:1000px;width:100%;background:#EEF3FE;border-color:#C9D7FA;color:#1F3A8A">Use the arrows next to each section to change the order learners see. Click <b>Done sorting</b> when finished.</div>
    </sc-if>

    <div style="display:flex;flex-direction:column;gap:16px">
      <sc-for list="{{sections}}" as="sec" hint-placeholder-count="3">
      <section class="sec" aria-label="Section {{sec.n}}: {{sec.name}}">
        <div class="sech">
          <sc-if value="{{sortMode}}" hint-placeholder-val="{{ false }}">
            <span style="display:flex;gap:2px">
              <button class="ib" aria-label="Move section {{sec.n}} up" disabled="{{sec.first}}" onClick="{{sec.up}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 15 6-6 6 6"></path></svg></button>
              <button class="ib" aria-label="Move section {{sec.n}} down" disabled="{{sec.last}}" onClick="{{sec.down}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 9 6 6 6-6"></path></svg></button>
            </span>
          </sc-if>
          <button class="sectog" aria-expanded="{{sec.exp}}" onClick="{{sec.toggle}}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#556070" stroke-width="2.2" style="transform:{{sec.chev}};flex:none" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
            <span><span class="secl">Section {{sec.n}}:</span> <b>{{sec.name}}</b></span>
            <span class="muted">{{sec.meta}}</span>
          </button>
          <span style="display:flex;gap:4px;align-items:center;flex-wrap:wrap">
            <button class="btn g sm" onClick="{{sec.addVideo}}">+ Video</button>
            <button class="btn g sm" onClick="{{sec.addQuiz}}" style="color:#7E22CE">+ Quiz</button>
            <button class="ib" aria-label="Rename section {{sec.n}}" title="Rename" onClick="{{sec.rename}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4Z"></path></svg></button>
            <button class="ib del" aria-label="Delete section {{sec.n}}" title="Delete" onClick="{{sec.del}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></button>
          </span>
        </div>
        <sc-if value="{{sec.open}}" hint-placeholder-val="{{ true }}">
        <div class="secb">
          <sc-for list="{{sec.videos}}" as="r" hint-placeholder-count="2">
          <div class="item">
            <span class="iic" style="background:#EAF0FD;color:#1F4FD1" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg></span>
            <span class="inm">
              <span style="display:block"><span class="muted">Video {{r.n}}:</span> <b style="font-weight:600">{{r.name}}</b></span>
              <a class="url" href="{{r.url}}" target="_blank" rel="noopener" title="{{r.url}}"><span>{{r.short}}</span></a>
            </span>
            <label class="sr" for="{{r.sid}}">Sequence for {{r.name}}</label>
            <input id="{{r.sid}}" class="seqin" type="number" min="1" title="Sequence" value="{{r.seqVal}}" onChange="{{r.onSeq}}" onBlur="{{r.commitSeq}}" onKeyDown="{{r.seqKey}}">
            <button class="ib" aria-label="Move {{r.name}} up" disabled="{{r.first}}" onClick="{{r.up}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 15 6-6 6 6"></path></svg></button>
            <button class="ib" aria-label="Move {{r.name}} down" disabled="{{r.last}}" onClick="{{r.down}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 9 6 6 6-6"></path></svg></button>
            <button class="switch {{r.swCls}}" role="switch" aria-checked="{{r.activeStr}}" aria-label="{{r.name}} active" title="{{r.activeLabel}}" onClick="{{r.toggle}}"><i></i></button>
            <button class="ib" aria-label="Edit {{r.name}}" title="Edit" onClick="{{r.edit}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4Z"></path></svg></button>
            <button class="ib del" aria-label="Delete {{r.name}}" title="Delete" onClick="{{r.del}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></button>
          </div>
          </sc-for>
          <sc-for list="{{sec.quizzes}}" as="z" hint-placeholder-count="1">
          <div class="item quiz">
            <span class="iic" style="background:#F1E6FD;color:#7E22CE" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 11l2 2 4-4"></path></svg></span>
            <span class="inm">
              <span style="display:block"><span class="muted">Quiz:</span> <b style="font-weight:600">{{z.name}}</b></span>
              <span class="muted">{{z.meta}}</span>
            </span>
            <sc-if value="{{z.required}}" hint-placeholder-val="{{ true }}"><span class="chip amber">Required</span></sc-if>
            <span class="chip {{z.stCls}}">{{z.status}}</span>
            <button class="btn s sm" onClick="{{z.open}}">Edit quiz</button>
            <button class="ib del" aria-label="Delete quiz {{z.name}}" title="Delete" onClick="{{z.del}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></button>
          </div>
          </sc-for>
          <sc-if value="{{sec.empty}}" hint-placeholder-val="{{ false }}">
            <div class="secempty">This section is empty. Add videos for learners to watch, then a quiz to check what they learned.</div>
          </sc-if>
        </div>
        </sc-if>
      </section>
      </sc-for>
      <sc-if value="{{noSections}}" hint-placeholder-val="{{ false }}">
        <div class="empty" style="max-width:1000px;margin:0 auto;width:100%;border:1px dashed #C6CEDA;border-radius:14px;background:#fff">
          <div style="font-weight:600;font-size:16px">Start with a section</div>
          <div class="muted">Sections group related videos, like Report or Settings. Each section can have its own quiz.</div>
          <button class="btn p" onClick="{{addSection}}" style="margin-top:6px">Add section</button>
        </div>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{isBasic}}" hint-placeholder-val="{{ false }}">
    <section class="panel" style="max-width:720px">
      <div class="ph"><h2 class="h2">Basic info</h2><span class="muted">Changes save automatically</span></div>
      <div style="padding:18px 20px;display:flex;flex-direction:column;gap:16px">
        <div class="fl">
          <label class="lbl" for="b-name">Course name <span class="req" aria-hidden="true">*</span></label>
          <input id="b-name" class="inp {{basic.nameCls}}" value="{{basic.name}}" onChange="{{basic.onName}}">
          <sc-if value="{{basic.nameErr}}" hint-placeholder-val="{{ false }}"><span class="ferr">Enter a course name.</span></sc-if>
        </div>
        <div style="display:flex;gap:12px;align-items:flex-start">
          <button class="switch {{basic.actCls}}" role="switch" aria-checked="{{basic.actStr}}" aria-labelledby="b-act" onClick="{{basic.flip}}"><i></i></button>
          <div><div class="lbl" id="b-act">Active</div><div class="hint">Learners can see this course in their course list.</div></div>
        </div>
      </div>
    </section>
  </sc-if>
</div>
</sc-if>

<sc-if value="{{isQuiz}}" hint-placeholder-val="{{ false }}">
<div class="wrap">
  <nav class="crumbs" aria-label="Breadcrumb">
    <button class="crumbbtn" onClick="{{goList}}">Courses</button><span aria-hidden="true">/</span>
    <button class="crumbbtn" onClick="{{backToCourse}}">{{cm.name}}</button><span aria-hidden="true">/</span>
    <span aria-current="page" style="color:#121826;font-weight:500">Quiz</span>
  </nav>
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <button class="btn s sm" onClick="{{backToCourse}}">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"></path></svg>
      Back to curriculum
    </button>
    <div style="flex:1;min-width:240px">
      <h2 id="b-title" style="margin:0;font-size:22px;font-weight:700">{{d.titleText}}</h2>
      <div class="muted">{{d.videoLabel}}</div>
    </div>
    <button class="btn s sm" style="color:#B42318" onClick="{{askDelete}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg>
      Delete quiz
    </button>
  </div>
      <div class="steps" role="tablist" aria-label="Quiz setup steps">
        <sc-for list="{{steps}}" as="st" hint-placeholder-count="3">
          <button class="stepb {{st.cls}}" role="tab" aria-selected="{{st.sel}}" aria-controls="step-panel" onClick="{{st.go}}">
            <span class="sdot" style="background:{{st.dotBg}};color:{{st.dotFg}}">
              <sc-if value="{{st.done}}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></sc-if>
              <sc-if value="{{st.warn}}" hint-placeholder-val="{{ false }}">!</sc-if>
              <sc-if value="{{st.plain}}" hint-placeholder-val="{{ true }}">{{st.n}}</sc-if>
            </span>
            <span style="min-width:0">
              <span class="stt">{{st.title}}</span>
              <span class="sts">{{st.sub}}</span>
            </span>
          </button>
        </sc-for>
      </div>

      <div id="step-panel" role="tabpanel" aria-label="{{stepName}}" style="display:flex;flex-direction:column;gap:18px">
      <!-- step 1 -->
      <sc-if value="{{isStep1}}" hint-placeholder-val="{{ true }}">
      <!-- 1. details -->
      <div class="card">
        <div class="ch">
          <span class="icon" style="background:#EAF0FD;color:#1F4FD1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"></path></svg></span>
          <div><h3 class="h2">Details</h3><div class="muted">Which section this quiz belongs to and what learners see.</div></div>
        </div>
        <div class="cbody">
          <div class="g2">
            <div class="fl">
              <label class="lbl" for="f-video">Section <span class="req" aria-hidden="true">*</span></label>
              <select id="f-video" class="inp {{d.videoCls}}" value="{{d.videoId}}" onChange="{{onVideo}}">
                <option value="">Choose a section…</option>
                <sc-for list="{{videoGroups}}" as="g" hint-placeholder-count="3">
                  <optgroup label="{{g.label}}">
                    <sc-for list="{{g.videos}}" as="v" hint-placeholder-count="2">
                      <option value="{{v.id}}">{{v.name}}</option>
                    </sc-for>
                  </optgroup>
                </sc-for>
              </select>
              <sc-if value="{{d.videoErr}}" hint-placeholder-val="{{ false }}"><span class="ferr">Choose the section this quiz belongs to.</span></sc-if>
              <span class="help">Learners take the quiz after this section's videos.</span>
            </div>
            <div class="fl">
              <label class="lbl" for="f-name">Quiz name <span class="req" aria-hidden="true">*</span></label>
              <input id="f-name" class="inp {{d.nameCls}}" placeholder="e.g. How To Add Employee" value="{{d.name}}" onChange="{{onName}}">
              <sc-if value="{{d.nameErr}}" hint-placeholder-val="{{ false }}"><span class="ferr">Enter a name for the quiz.</span></sc-if>
            </div>
            <div class="fl">
              <label class="lbl" for="f-type">Quiz type</label>
              <input id="f-type" class="inp" placeholder="e.g. Quiz" value="{{d.type}}" onChange="{{onType}}">
            </div>
            <div class="fl">
              <label class="lbl" for="f-seq">Order in the section</label>
              <input id="f-seq" class="inp" type="number" min="1" value="{{d.seq}}" onChange="{{onSeq}}">
              <span class="help">Only matters when a section has more than one quiz.</span>
            </div>
          </div>
          <div class="fl">
            <label class="lbl" for="f-desc">Description</label>
            <textarea id="f-desc" class="inp" placeholder="Tell learners what this quiz covers (optional)" value="{{d.desc}}" onChange="{{onDesc}}"></textarea>
          </div>
        </div>
      </div>

      </sc-if>

      <!-- step 2 -->
      <sc-if value="{{isStep2}}" hint-placeholder-val="{{ false }}">
      <div class="g2" style="align-items:start">
        <div class="card">
          <div class="ch">
            <span class="icon" style="background:#FFF1E8;color:#C2410C"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span>
            <div><h3 class="h2">Rules</h3><div class="muted">Passing, attempts and timing.</div></div>
          </div>
          <div class="cbody" style="gap:12px">
            <div class="rule">
              <label class="lbl" for="f-pass">Passing score</label>
              <div class="suffix" style="max-width:160px"><input id="f-pass" class="inp {{d.passCls}}" type="number" min="1" max="100" value="{{d.pass}}" onChange="{{onPass}}"><span>%</span></div>
              <sc-if value="{{d.passErr}}" hint-placeholder-val="{{ false }}"><span class="ferr">Enter a number from 1 to 100.</span></sc-if>
            </div>
            <sc-for list="{{rules}}" as="r" hint-placeholder-count="3">
            <div class="rule">
              <span class="lbl" id="{{r.lid}}">{{r.label}}</span>
              <div class="seg" role="radiogroup" aria-labelledby="{{r.lid}}">
                <button class="segb {{r.offCls}}" role="radio" aria-checked="{{r.offSel}}" onClick="{{r.setOff}}">{{r.offText}}</button>
                <button class="segb {{r.onCls}}" role="radio" aria-checked="{{r.onSel}}" onClick="{{r.setOn}}">{{r.onText}}</button>
              </div>
              <sc-if value="{{r.showVal}}" hint-placeholder-val="{{ false }}">
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                  <label class="sr" for="{{r.iid}}">{{r.label}} value</label>
                  <div class="suffix" style="width:150px"><input id="{{r.iid}}" class="inp {{r.cls}}" type="number" min="1" value="{{r.val}}" onChange="{{r.onVal}}"><span>{{r.unit}}</span></div>
                </div>
                <sc-if value="{{r.err}}" hint-placeholder-val="{{ false }}"><span class="ferr">{{r.errText}}</span></sc-if>
              </sc-if>
              <span class="help">{{r.help}}</span>
            </div>
            </sc-for>
          </div>
        </div>

        <div class="card">
          <div class="ch">
            <span class="icon" style="background:#F6EEFE;color:#7E22CE"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></span>
            <div><h3 class="h2">Learner experience</h3><div class="muted">How the quiz behaves for learners.</div></div>
          </div>
          <div class="cbody" style="gap:0;padding-top:6px;padding-bottom:6px">
            <sc-for list="{{toggles}}" as="t" hint-placeholder-count="6">
            <div class="tg">
              <button class="switch {{t.cls}}" role="switch" aria-checked="{{t.str}}" aria-labelledby="{{t.lid}}" aria-describedby="{{t.did}}" onClick="{{t.flip}}"><i></i></button>
              <div>
                <div class="lbl" id="{{t.lid}}">{{t.label}}</div>
                <div class="help" id="{{t.did}}">{{t.desc}}</div>
              </div>
            </div>
            </sc-for>
          </div>
        </div>
      </div>

      </sc-if>

      <!-- step 3 -->
      <sc-if value="{{isStep3}}" hint-placeholder-val="{{ false }}">
      <sc-if value="{{hasQs}}" hint-placeholder-val="{{ true }}">
      <div class="qws">
        <aside class="card" aria-labelledby="qnav-h">
          <div class="ch" style="padding:14px 16px">
            <div style="flex:1"><h3 class="h2" id="qnav-h">Questions</h3><div class="muted">{{qSummary}}</div></div>
          </div>
          <ol class="qnav">
            <sc-for list="{{qs}}" as="q" hint-placeholder-count="6">
            <li>
              <button class="qn {{q.navCls}}" aria-current="{{q.selStr}}" onClick="{{q.pick}}">
                <span class="qnum" style="width:26px;height:26px;font-size:12px;background:{{q.numBg}}">{{q.n}}</span>
                <span style="flex:1;min-width:0">
                  <span class="qnt">{{q.title}}</span>
                  <span class="muted" style="display:block;font-size:12px">{{q.navSub}}</span>
                </span>
                <sc-if value="{{q.hasIssue}}" hint-placeholder-val="{{ false }}"><span class="dot" style="background:#E9A23B" title="Needs attention"></span></sc-if>
              </button>
            </li>
            </sc-for>
          </ol>
          <div style="padding:10px 12px;border-top:1px solid #EDF0F4">
            <button class="btn s sm" style="width:100%" onClick="{{addQ}}">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
              Add question
            </button>
          </div>
        </aside>

        <section class="card {{qe.cls}}" aria-labelledby="qe-h">
          <div class="ch" style="flex-wrap:wrap">
            <span class="qnum" style="background:{{qe.numBg}}">{{qe.n}}</span>
            <div style="flex:1;min-width:180px">
              <h3 class="h2" id="qe-h">Question {{qe.n}} of {{qCount}}</h3>
              <div class="muted">{{qe.summary}}</div>
            </div>
            <span style="display:flex;gap:2px">
              <button class="ib" aria-label="Move question up" title="Move up" disabled="{{qe.first}}" onClick="{{qe.up}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 15 6-6 6 6"></path></svg></button>
              <button class="ib" aria-label="Move question down" title="Move down" disabled="{{qe.last}}" onClick="{{qe.down}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 9 6 6 6-6"></path></svg></button>
              <button class="ib" aria-label="Duplicate question" title="Duplicate" onClick="{{qe.dup}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg></button>
              <button class="ib del" aria-label="Delete question" title="Delete" onClick="{{qe.del}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></button>
            </span>
          </div>
          <div class="cbody">
            <div class="fl">
              <label class="lbl" for="{{qe.tid}}">Question <span class="req" aria-hidden="true">*</span></label>
              <textarea id="{{qe.tid}}" class="inp" style="min-height:60px" placeholder="Type the question learners will answer" value="{{qe.text}}" onChange="{{qe.onText}}"></textarea>
            </div>
            <div class="qmeta">
              <div class="fl">
                <label class="lbl" for="{{qe.yid}}">Answer type</label>
                <select id="{{qe.yid}}" class="inp" value="{{qe.type}}" onChange="{{qe.onType}}">
                  <option value="single">One correct answer</option>
                  <option value="multi">More than one correct answer</option>
                </select>
              </div>
              <div class="fl">
                <label class="lbl" for="{{qe.pid}}">Points</label>
                <input id="{{qe.pid}}" class="inp" type="number" min="1" value="{{qe.points}}" onChange="{{qe.onPoints}}">
              </div>
              <div class="fl" style="flex-direction:row;align-items:center;gap:10px;height:40px">
                <button class="switch {{qe.actCls}}" role="switch" aria-checked="{{qe.actStr}}" aria-label="Question active" onClick="{{qe.flipActive}}"><i></i></button>
                <span class="lbl" aria-hidden="true">Active</span>
              </div>
            </div>

            <div class="fl" style="gap:8px">
              <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
                <span class="lbl">Answer options</span>
                <span class="help">{{qe.markHelp}}</span>
              </div>
              <div class="opts" role="group" aria-label="Answer options">
                <sc-for list="{{qe.opts}}" as="o" hint-placeholder-count="4">
                <div class="opt {{o.cls}}">
                  <button class="mark {{o.markCls}}" role="{{o.role}}" aria-checked="{{o.correctStr}}" aria-label="{{o.markLabel}}" title="{{o.markLabel}}" onClick="{{o.mark}}">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
                  </button>
                  <span class="letter" aria-hidden="true">{{o.letter}}</span>
                  <div>
                    <label class="sr" for="{{o.id}}">Option {{o.letter}} text</label>
                    <input id="{{o.id}}" class="inp" placeholder="Type an answer option" value="{{o.text}}" onChange="{{o.onText}}">
                  </div>
                  <div class="oact">
                    <sc-if value="{{o.correct}}" hint-placeholder-val="{{ false }}"><span class="chip green" style="margin-right:4px">Correct</span></sc-if>
                    <button class="ib {{o.mediaCls}}" aria-label="Add image or video link to option {{o.letter}}" title="Image or video link" aria-expanded="{{o.mediaExp}}" onClick="{{o.toggleMedia}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="m21 16-5-5-9 8"></path></svg></button>
                    <button class="switch {{o.actCls}}" role="switch" aria-checked="{{o.actStr}}" aria-label="Option {{o.letter}} active" title="Active" onClick="{{o.flipActive}}" style="margin:0 4px"><i></i></button>
                    <button class="ib" aria-label="Move option {{o.letter}} up" disabled="{{o.first}}" onClick="{{o.up}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 15 6-6 6 6"></path></svg></button>
                    <button class="ib" aria-label="Move option {{o.letter}} down" disabled="{{o.last}}" onClick="{{o.down}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 9 6 6 6-6"></path></svg></button>
                    <button class="ib del" aria-label="Remove option {{o.letter}}" onClick="{{o.del}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
                  </div>
                  <sc-if value="{{o.showMedia}}" hint-placeholder-val="{{ false }}">
                    <div class="media">
                      <label class="sr" for="{{o.mid}}">Option {{o.letter}} image or video URL</label>
                      <input id="{{o.mid}}" class="inp" style="border-color:#D3D9E2;background:#fff" placeholder="Image or video URL (optional)" value="{{o.media}}" onChange="{{o.onMedia}}">
                    </div>
                  </sc-if>
                </div>
                </sc-for>
              </div>
              <button class="btn g sm" style="align-self:flex-start;padding-left:6px" onClick="{{qe.addOpt}}">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
                Add option
              </button>
            </div>

            <sc-if value="{{qe.hasIssue}}" hint-placeholder-val="{{ false }}">
              <div class="issues" role="status">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:none;margin-top:1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
                <ul><sc-for list="{{qe.issues}}" as="m" hint-placeholder-count="1"><li>{{m.text}}</li></sc-for></ul>
              </div>
            </sc-if>
          </div>
          <div class="qfoot">
            <button class="btn s sm" disabled="{{qe.first}}" onClick="{{qe.prevQ}}">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"></path></svg>
              Previous question
            </button>
            <sc-if value="{{qe.notLast}}" hint-placeholder-val="{{ true }}">
              <button class="btn s sm" onClick="{{qe.nextQ}}">
                Next question
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 18 6-6-6-6"></path></svg>
              </button>
            </sc-if>
            <sc-if value="{{qe.last}}" hint-placeholder-val="{{ false }}">
              <button class="btn s sm" onClick="{{addQ}}">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
                Add another question
              </button>
            </sc-if>
          </div>
        </section>
      </div>
      </sc-if>

      <sc-if value="{{noQs}}" hint-placeholder-val="{{ false }}">
        <div class="qempty">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#8D9AB0" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.4M12 17h.01"></path></svg>
          <div style="font-weight:600;font-size:16px">No questions yet</div>
          <div class="muted">Add the first question. Each one starts with four answer options.</div>
          <button class="btn p" onClick="{{addQ}}" style="margin-top:6px">Add question</button>
        </div>
      </sc-if>
      </sc-if>
      </div>

        levelErr: m.levelErr,
        rowsCls: m.input === 'rows' ? 'on' : '', pasteCls: m.input === 'paste' ? 'on' : '',
        rowsSel: m.input === 'rows' ? 'true' : 'false', pasteSel: m.input === 'paste' ? 'true' : 'false',
        toRows: function () { self.setM({ input: 'rows' }); }, toPaste: function () { self.setM({ input: 'paste', ok: '' }); },
        showRows: m.input === 'rows', showPaste: m.input === 'paste',
        hasErr: !!m.errText, errText: m.errText, hasOk: !!m.ok, ok: m.ok,
        rows: m.rows.map(function (r, i) {
          var upd = function (patch) { var rs = m.rows.slice(); rs[i] = Object.assign({}, r, patch); self.setM({ rows: rs }); };
          var lvCount = mc && m.level && m.level !== 'u' ? self.byLevel(mc, m.level).length : 0;
          return {
            n: i + 1, nid: 'mn-' + r.key, uid: 'mu-' + r.key, name: r.name, url: r.url,
            nCls: r.errName ? 'bad' : '', uCls: r.errUrl ? 'bad' : '',
            hasNErr: !!r.errName, errName: r.errName, hasUErr: !!r.errUrl, errUrl: r.errUrl,
            onName: function (e) { upd({ name: e.target.value, errName: '' }); },
            onUrl: function (e) { upd({ url: e.target.value, errUrl: '' }); },
            qid: 'mq-' + r.key, seq: r.seq, seqPh: isAdd ? String(lvCount + i + 1) : '',
            qCls: r.errSeq ? 'bad' : '', hasQErr: !!r.errSeq, errSeq: r.errSeq,
            onSeq: function (e) { upd({ seq: e.target.value, errSeq: '' }); },
            swCls: r.active ? 'on' : '', activeStr: r.active ? 'true' : 'false',
            toggle: function () { upd({ active: !r.active }); },
            only: m.rows.length === 1 || !isAdd,
            remove: function () { var rs = m.rows.slice(); rs.splice(i, 1); self.setM({ rows: rs }); }
          };
        }),
        addRow: function () { self.setM({ rows: m.rows.concat([self.blankRow()]) }); },
        hint: isAdd ? 'Leave Sequence empty to add to the end of ' + (self.secName(m.cid, m.level) || 'the chosen section') + '. Enter a number to insert at that position; videos below move down by one.' : 'Sequence sets where learners see this video in the section (1 is first). Other videos shift to make room.',
        paste: m.paste, onPaste: function (e) { self.setM({ paste: e.target.value, pasteErr: false }); },
        pasteErr: m.pasteErr, pasteCount: pasteCount === 1 ? '1 video' : pasteCount + ' videos',
        convert: function () {
          var parsed = self.parse(m.paste);
          if (!parsed.length) { self.setM({ pasteErr: true }); return; }
          var keep = m.rows.filter(function (r) { return r.name.trim() || r.url.trim(); });
          self.setM({ rows: keep.concat(parsed), input: 'rows', paste: '', errText: '', ok: parsed.length + (parsed.length === 1 ? ' video' : ' videos') + ' ready to review.' });
        },
        footNote: isAdd ? filled + (filled === 1 ? ' video' : ' videos') + ' to add' : '',
        cta: isAdd ? 'Add ' + filled + (filled === 1 ? ' video' : ' videos') : 'Save changes',
        save: function () { self.save(); }
      };
    }

    // section modal
    var sm = {};
    if (s.secModal) {
      var x = s.secModal, bad = x.tried && !x.name.trim();
      var saveSec = function () {
        var cur = self.state.secModal;
        if (!cur.name.trim()) { self.setState({ secModal: Object.assign({}, cur, { tried: true }) }); return; }
        var cs;
        if (cur.mode === 'add') {
          var ns = { id: self.id('s'), name: cur.name.trim() };
          cs = self.mapSections(self.state.courses, cid, function (ss) { return ss.concat([ns]); });
          self.setState({ courses: cs, secModal: null });
          self.flash('Section ' + (c.sections.length + 1) + ': ' + ns.name + ' added');
        } else {
          cs = self.mapSections(self.state.courses, cid, function (ss) { return ss.map(function (y) { return y.id === cur.sid ? Object.assign({}, y, { name: cur.name.trim() }) : y; }); });
          self.setState({ courses: cs, secModal: null });
          self.flash('Section renamed');
        }
      };
      sm = { title: x.mode === 'add' ? 'Add section' : 'Rename section', cta: x.mode === 'add' ? 'Add section' : 'Save name',
        n: x.mode === 'add' ? c.sections.length + 1 : self.secIndex(c, x.sid) + 1, preview: x.name.trim() || '…',
        name: x.name, err: bad, cls: bad ? 'bad' : '',
        onName: function (e) { self.setState({ secModal: Object.assign({}, self.state.secModal, { name: e.target.value, tried: false }) }); },
        key: function (e) { if (e.key === 'Enter') saveSec(); if (e.key === 'Escape') self.setState({ secModal: null }); },
        cancel: function () { self.setState({ secModal: null }); }, save: saveSec };
    }

    // confirm
    var cf = {};
    if (s.confirm) {
      var k = s.confirm;
      cf = { cls: 'd', cancel: function () { self.setState({ confirm: null }); } };
      if (k.kind === 'delVid') {
        cf.title = 'Delete "' + k.name + '"?';
        cf.body = 'Learners will no longer see this video. This can\'t be undone. To hide it for now, switch it to inactive instead.';
        cf.cta = 'Delete video';
        cf.ok = function () {
          var cs = self.mapCourse(self.state.courses, cid, function (vs) { return vs.filter(function (v) { return k.ids.indexOf(v.id) < 0; }); });
          cs = self.renumber(cs, cid, k.sid);
          self.setState({ courses: cs, confirm: null }); self.flash('Video deleted');
        };
      }
      if (k.kind === 'delSec') {
        var si2 = self.secIndex(c, k.sid), vN = self.byLevel(c, k.sid).length, qN = self.quizzesOf(cid, k.sid).length;
        cf.title = 'Delete Section ' + (si2 + 1) + ': ' + c.sections[si2].name + '?';
        cf.body = 'This also deletes its ' + vN + (vN === 1 ? ' video' : ' videos') + ' and ' + qN + (qN === 1 ? ' quiz' : ' quizzes') + '. This can\'t be undone.';
        cf.cta = 'Delete section';
        cf.ok = function () {
          var key = cid + ':' + k.sid;
          var cs = self.mapSections(self.state.courses, cid, function (ss) { return ss.filter(function (y) { return y.id !== k.sid; }); });
          cs = self.mapCourse(cs, cid, function (vs) { return vs.filter(function (v) { return v.level !== k.sid; }); });
          self.setState({ courses: cs, saved: self.state.saved.filter(function (a) { return a.videoId !== key; }), confirm: null });
          self.flash('Section deleted');
        };
      }
      if (k.kind === 'delQuiz') {
        cf.title = 'Delete quiz "' + k.name + '"?';
        cf.body = 'Its questions and answers will be removed. To hide it for now, open the quiz and turn off Active instead.';
        cf.cta = 'Delete quiz';
        cf.ok = function () { self.setState({ saved: self.state.saved.filter(function (a) { return a.id !== k.id; }), confirm: null }); self.flash('Quiz deleted'); };
      }
    }
    var basicBad = !c.name.trim();
    return {
      isCurr: s.mtab === 'curr', isBasic: s.mtab === 'basic',
      sections: sections, noSections: sections.length === 0,
      sortMode: s.sortMode, sortCls: s.sortMode ? 'on' : '', sortPressed: s.sortMode ? 'true' : 'false', sortLabel: s.sortMode ? 'Done sorting' : 'Sort sections',
      toggleSort: function () { self.setState({ sortMode: !s.sortMode }); },
      addSection: function () { self.setState({ secModal: { mode: 'add', name: '', tried: false } }); },
      addVideosTop: function () {
        if (!firstSec) { self.flash('Add a section first'); self.setState({ secModal: { mode: 'add', name: '', tried: false } }); return; }
        self.openModal('add', cid, firstSec.id, [self.blankRow(), self.blankRow(), self.blankRow()]);
      },
      addQuizTop: function () {
        if (!firstSec) { self.flash('Add a section first'); self.setState({ secModal: { mode: 'add', name: '', tried: false } }); return; }
        self.newQuiz('');
      },
      hasModal: !!m, m: mv, closeModal: function () { self.setState({ modal: null }); },
      hasSecModal: !!s.secModal, sm: sm,
      hasConfirm: !!s.confirm, cf: cf,
      basic: { name: c.name, nameErr: basicBad, nameCls: basicBad ? 'bad' : '',
        onName: function (e) { var v = e.target.value; setCourses(self.state.courses.map(function (y) { return y.id === cid ? Object.assign({}, y, { name: v }) : y; })); },
        actCls: c.active ? 'on' : '', actStr: c.active ? 'true' : 'false',
        flip: function () { setCourses(self.state.courses.map(function (y) { return y.id === cid ? Object.assign({}, y, { active: !y.active }) : y; })); self.flash(c.active ? 'Course set to inactive' : 'Course set to active'); } }
    };
  }
  previewVals() {
    var self = this, s = this.state;
    var c = s.preview ? this.course(s.preview) : null;
    if (!c) return { sections: [] };
    var tv = 0, tq = 0;
    var secs = c.sections.map(function (x, i) {
      var vids = self.byLevel(c, x.id).filter(function (v) { return v.active; });
      var qz = self.quizzesOf(c.id, x.id).filter(function (a) { return a.active; });
      tv += vids.length; tq += qz.length;
      return { n: i + 1, name: x.name,
        meta: vids.length + (vids.length === 1 ? ' video' : ' videos') + (qz.length ? ' · ' + qz.length + (qz.length === 1 ? ' quiz' : ' quizzes') : ''),
        videos: vids.map(function (v, j) { return { n: j + 1, name: v.name }; }),
        quizzes: qz.map(function (a) {
          var nq = a.questions.filter(function (q) { return q.active; }).length;
          return { name: a.name, required: a.required,
            meta: 'Pass mark ' + a.pass + '% · ' + nq + (nq === 1 ? ' question' : ' questions') + (a.timeOn ? ' · ' + a.timeN + ' min' : '') + (a.attemptsOn ? ' · ' + a.attemptsN + ' attempts' : ''),
            unlock: a.unlockOn ? 'Unlocks after you finish this section\'s videos' : 'You can take it any time' };
        }),
        empty: !vids.length && !qz.length };
    });
    return { name: c.name, mono: c.mono, hue: c.hue, inactive: !c.active,
      meta: secs.length + (secs.length === 1 ? ' section' : ' sections') + ' · ' + tv + (tv === 1 ? ' video' : ' videos') + ' · ' + tq + (tq === 1 ? ' quiz' : ' quizzes'),
      sections: secs, noSections: secs.length === 0,
      canEdit: s.view !== 'quiz',
      edit: function () { self.setState({ preview: null, view: 'course', cid: c.id, mtab: 'curr' }); } };
  }
  renderVals() {
    var self = this, s = this.state;
    var mod = s.view === 'list' ? this.listVals() : s.view === 'course' ? Object.assign(this.headVals(), this.courseVals()) : Object.assign(this.headVals(), this.asgVals());
    return Object.assign({}, mod, {
      isList: s.view === 'list', isCourse: s.view === 'course', isQuiz: s.view === 'quiz',
      navCount: s.courses.length,
      hasPreview: !!s.preview && !!this.course(s.preview), pv: this.previewVals(),
      closePreview: function () { self.setState({ preview: null }); },
      pvKey: function (e) { if (e.key === 'Escape') self.setState({ preview: null }); },
      goList: function () { if (s.view === 'quiz' && self.isDirty()) self.setState({ aconfirm: { kind: 'leaveList' } }); else self.setState({ view: 'list' }); },
      hasToast: !!s.toast, toast: s.toast
    });
  }
}

DC.mount(Component, document.getElementById('dc-root'), document.getElementById('dc-src').textContent);
</script>
