<style>
body{margin:0}

.btn.w{background:#fff;color:#0F1E36}.btn.w:hover{background:#E6EBF3}

.sort{display:flex;align-items:center;gap:8px;font-size:13px;color:#556070}

.card{transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}

.stepdot{width:30px;height:30px;border-radius:50%;background:#EEF1F5;color:#3D4757;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.stepname{font-size:18px;font-weight:700}
.stepdesc{font-size:13.5px;color:#3D4757}
.stepbadge{position:absolute;top:16px;right:48px;color:#fff;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.01em}
.stepfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:4px}
.stepcta{display:inline-flex;align-items:center;gap:4px;color:#fff;font-weight:600;font-size:13.5px;padding:7px 12px;border-radius:9px}
.step:hover .stepcta{filter:brightness(1.08)}
.lvswitchrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lvswitch{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.lvpill{display:inline-flex;align-items:center;gap:8px;border:1.5px solid;border-radius:22px;padding:7px 14px;font-weight:600;cursor:pointer;min-height:38px;font-family:inherit}
.lvpill:hover{filter:brightness(.97)}
.pdot{width:8px;height:8px;border-radius:50%}
@media (max-width:720px){.lvswitch{margin-left:0;width:100%}.lvpill{flex:1;justify-content:center}}
.listflash{animation:lflash 1.4s ease}
@keyframes lflash{0%,30%{background:#FFF4D6;box-shadow:0 0 0 4px #FFE7A3}100%{background:transparent;box-shadow:none}}
@media (prefers-reduced-motion:reduce){.listflash{animation:none}}
.acc{background:#fff;border:1px solid #E1E5EC;border-left:4px solid #C9D7FA;border-radius:14px;overflow:hidden;transition:box-shadow .15s ease}
.acc:hover{box-shadow:0 4px 14px rgba(15,30,54,.06)}
.acc.open{box-shadow:0 8px 24px rgba(15,30,54,.08)}
.acc{border-left-width:5px}
.acc.prog{border-color:#C9D7FA}
.acc.prog .acchead{background:linear-gradient(90deg,#E8EFFD 0%,#F7F9FF 55%,#FFFFFF 100%)}
.acc.prog .secnum{box-shadow:0 0 0 4px rgba(31,79,209,.15)}
.acc.done{border-color:#BFE3CF}
.acc.done .acchead{background:linear-gradient(90deg,#E9F7EE 0%,#F7FCF9 55%,#FFFFFF 100%)}
.acc.done .acctitle{color:#11643C}
.acc.new .acchead{background:#fff}
.acc.soon{border-style:dashed;background:#FAFBFC}
.acc.soon .acctitle{color:#556070}
.stchip{gap:6px}
.stdot{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip.st-new{background:#F3F5F8;color:#3D4757;border-color:#E1E5EC}
.chip.st-lock{background:#F2F3F5;color:#5E6878;border-color:#E1E4E9}
.topnav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;min-height:40px}
.navctx{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#556070}
.wtoast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#121826;color:#fff;padding:12px 16px;border-radius:10px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:60;font-weight:500}
.chip.st-soon{background:#fff;color:#8D9AB0;border-color:#E1E5EC;border-style:dashed}
.acchead{display:flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;flex-wrap:wrap}
.acctog{flex:1;min-width:240px;display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:left;cursor:pointer;padding:12px 8px;border-radius:10px;font-family:inherit;color:inherit}
.acctog:hover .acctitle{color:#1F4FD1}
.accchev{flex:none;color:#556070;transition:transform .15s ease}
.acctitle{display:block;font-size:16.5px;font-weight:700}
.accprog{display:flex;align-items:center;gap:8px;width:150px;font-size:12.5px;color:#556070}
.accprog .bar{flex:1}
.accbody{border-top:1px solid #EDF0F4}
.accbody .asgbox{margin-top:12px}
@media (max-width:720px){.accprog{display:none}.acchead .btn{width:100%;margin:0 0 8px 8px}}
@media (prefers-reduced-motion:reduce){.accchev,.acc{transition:none}}
.secnum{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.lvtop{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 20px;border-bottom:1px solid #E1E5EC}
.asgbox{margin:4px 16px 16px;border:1px solid #C9D7FA;background:#F5F8FE;border-radius:12px;overflow:hidden}
@media (max-width:720px){.path{grid-template-columns:1fr;gap:10px}.step{min-height:0}.step:not(:last-child)::after{display:none}.lvtop .btn{width:100%}}
@media (prefers-reduced-motion:reduce){.step:hover{transform:none}}
.chev{transition:transform .15s ease;flex:none}
.chev.open{transform:rotate(180deg)}
@media (max-width:900px){.player{grid-template-columns:1fr}.hero .side{margin-left:0;width:100%}}
@media (max-width:720px){
.shell{flex-direction:column}
.rail{width:100%;flex-direction:row;justify-content:center;padding:6px 8px;border-top:1px solid #22324F}
.railgap{display:none}
.main{padding:20px 16px 40px}
.topmeta .tm{display:none}
.search{width:100%;margin-left:0}
.lrow{grid-template-columns:36px minmax(0,1fr)}
.lbar{display:none}
.banner .bact{margin-left:0}
}
@media (prefers-reduced-motion:reduce){.app *{transition:none!important}}
</style>

<style>
html,body{margin:0;min-width:1280px}
.wrap{max-width:1600px !important}
.player{grid-template-columns:minmax(0,1fr) 400px !important}
</style>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-template" id="dc-src"><div class="app">
<header class="top">
  <div class="logo" aria-hidden="true">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"></path><path d="M6 12v5c3 2 9 2 12 0v-5"></path></svg>
  </div>
  <button class="topbtn" aria-label="Switch app, current: My App">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
    My App
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"></path></svg>
  </button>
  <button class="topbtn" aria-label="Location: Altametrics">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
    Altametrics
  </button>
  <div class="topmeta">
    <span class="tm"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 18h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.1 11.1 3.5 3.5 0 0 0 7 18Z"></path></svg>90°F</span>
    <span class="tm"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>4:15 AM · America/Los Angeles</span>
    <button class="avatar" aria-label="Account menu">JD</button>
  </div>
</header>

<div class="shell">
<nav class="rail" aria-label="Main">
  <button class="railbtn on" aria-label="Courses" aria-current="page" title="Courses" onClick="{{goCourses}}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2Z"></path><path d="M9 7h6"></path></svg>
  </button>
  <button class="railbtn" aria-label="Profile" title="Profile">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
  </button>
  <button class="railbtn" aria-label="Documents" title="Documents">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M8 3h8l4 4v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"></path><path d="M16 3v4h4M10 13h6M10 17h4"></path></svg>
  </button>
  <div class="railgap"></div>
  <button class="railbtn" aria-label="Help and support" title="Help and support">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.4M12 17h.01"></path></svg>
  </button>
</nav>

<main class="main">

<!-- ============ COURSES (All / My) ============ -->
<sc-if value="{{isList}}" hint-placeholder-val="{{ true }}">
<div class="wrap">
  <div>
    <h1 class="h1">Welcome back <span aria-hidden="true">👋</span></h1>
    <p class="sub">Learn the Altametrics apps you use every day, one short video at a time.</p>
  </div>

  <div class="stats">
    <div class="stat">
      <span class="sicon" style="background:#E3EBFD;color:#1F4FD1"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2Z"></path><path d="M9 7h6"></path></svg></span>
      <span><span class="sval" style="display:block">{{statEnrolled}}</span><span class="slbl">Enrolled courses</span></span>
    </div>
    <div class="stat">
      <span class="sicon" style="background:#FFF1E8;color:#C2410C"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span>
      <span><span class="sval" style="display:block">{{statProg}}</span><span class="slbl">In progress</span></span>
    </div>
    <div class="stat">
      <span class="sicon" style="background:#E9F7EE;color:#15803D"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="m8 12.5 3 3 5-6"></path></svg></span>
      <span><span class="sval" style="display:block">{{statDone}}</span><span class="slbl">Completed</span></span>
    </div>
    <div class="stat">
      <span class="sicon" style="background:#F6EEFE;color:#7E22CE"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z"></path><path d="M17 6h3v2a3 3 0 0 1-3 3M7 6H4v2a3 3 0 0 0 3 3"></path></svg></span>
      <span><span class="sval" style="display:block">{{statPassed}}</span><span class="slbl">Quizzes passed</span></span>
    </div>
  </div>

  <section class="resume overall" aria-labelledby="overall-h">
    <div class="ring" role="img" aria-label="Overall course completion {{ov.pct}}">
      <svg width="104" height="104" viewBox="0 0 104 104" aria-hidden="true">
        <circle cx="52" cy="52" r="44" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="10"></circle>
        <circle cx="52" cy="52" r="44" fill="none" stroke="url(#ovgrad)" stroke-width="10" stroke-linecap="round" stroke-dasharray="{{ov.dash}} 999" transform="rotate(-90 52 52)"></circle>
        <defs><linearGradient id="ovgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD166"></stop><stop offset="1" stop-color="#FF9F43"></stop></linearGradient></defs>
      </svg>
      <span class="ringval">{{ov.pct}}</span>
    </div>
    <div class="rinfo">
      <h2 class="lbl2" id="overall-h" style="margin:0;font-weight:500">Overall course completion</h2>
      <div class="rtitle">{{ov.summary}}</div>
      <div class="seg" role="img" aria-label="{{ov.done}} completed, {{ov.prog}} in progress, {{ov.notStarted}} not started">
        <i style="width:{{ov.wDone}};background:#4ADE80"></i>
        <i style="width:{{ov.wProg}};background:#FFD166"></i>
        <i style="width:{{ov.wNew}};background:rgba(255,255,255,.26)"></i>
      </div>
      <div class="legend" aria-hidden="true">
        <span><b class="ld" style="background:#4ADE80"></b>{{ov.done}} completed</span>
        <span><b class="ld" style="background:#FFD166"></b>{{ov.prog}} in progress</span>
        <span><b class="ld" style="background:rgba(255,255,255,.5)"></b>{{ov.notStarted}} not started</span>
      </div>
      <sc-if value="{{ov.hasProg}}" hint-placeholder-val="{{ true }}">
      <div class="ovchips">
        <span class="lbl2">Pick up where you left off:</span>
        <sc-for list="{{ov.top}}" as="o" hint-placeholder-count="2">
          <button class="ovchip" onClick="{{o.open}}">{{o.title}} <b>{{o.pct}}</b></button>
        </sc-for>
        <sc-if value="{{ov.hasMore}}" hint-placeholder-val="{{ false }}">
          <button class="ovchip ghost" onClick="{{ov.seeMore}}">+{{ov.more}} more</button>
        </sc-if>
      </div>
      </sc-if>
    </div>
    <button class="btn w" onClick="{{ov.viewAll}}">
      View all my courses
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"></path></svg>
    </button>
  </section>

  <div class="toolbar">
    <h2 class="h2 {{listFlashCls}}" id="my-courses" tabindex="-1" style="font-size:19px;margin:0;display:flex;align-items:center;gap:8px;scroll-margin-top:16px;border-radius:8px;padding:2px 6px">My courses <span class="chip">{{mineCount}}</span></h2>
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#556070" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <label class="sr" for="course-search">Search courses</label>
      <input id="course-search" type="search" placeholder="Search courses" value="{{query}}" onChange="{{onQuery}}">
      <sc-if value="{{hasQuery}}" hint-placeholder-val="{{ false }}">
        <button class="clear" aria-label="Clear search" onClick="{{clearQuery}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
      </sc-if>
    </div>
  </div>

  <div class="listbar">
    <sc-if value="{{isMine}}" hint-placeholder-val="{{ false }}">
      <div class="filters" aria-label="Filter by progress">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
          <button class="fchip {{f.cls}}" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}">{{f.label}} <span class="n">{{f.n}}</span></button>
        </sc-for>
      </div>
    </sc-if>
    <div class="sort">
      <label for="course-sort">Sort by</label>
      <select id="course-sort" value="{{sortVal}}" onChange="{{onSort}}">
        <option value="default">Recommended</option>
        <option value="az">Title A–Z</option>
        <option value="rating">Highest rated</option>
        <option value="progress">Most progress</option>
      </select>
    </div>
  </div>

  <sc-if value="{{hasResults}}" hint-placeholder-val="{{ true }}">
  <div class="grid">
    <sc-for list="{{visible}}" as="c" hint-placeholder-count="3">
    <article class="card">
      <div class="cover" style="background:{{c.tint}}">
        <span class="blob b1" style="background:{{c.hue}}" aria-hidden="true"></span>
        <span class="blob b2" style="background:{{c.hue}}" aria-hidden="true"></span>
        <span class="wm" style="color:{{c.hue}}" aria-hidden="true">{{c.mono}}</span>
        <div class="chips2">
          <span class="chip">{{c.level}}</span>
          <sc-if value="{{isMine}}" hint-placeholder-val="{{ false }}">
            <span class="chip {{c.stCls}}">{{c.statusLabel}}</span>
          </sc-if>
          <sc-if value="{{isAll}}" hint-placeholder-val="{{ true }}">
            <sc-if value="{{c.enrolled}}" hint-placeholder-val="{{ true }}">
              <span class="chip st-enrolled">Enrolled</span>
            </sc-if>
          </sc-if>
        </div>
        <div class="mono" style="background:{{c.hue}}" aria-hidden="true">{{c.mono}}</div>
        <button class="cplay" aria-label="{{c.playLabel}}" title="{{c.playLabel}}" onClick="{{c.resume}}" style="color:{{c.hue}}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
        </button>
      </div>
      <div class="cbody">
        <button class="ctitle" onClick="{{c.open}}">{{c.title}}</button>
        <p class="cdesc">{{c.desc}}</p>
        <div class="meta2">
          <span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="m10 9.5 4.5 2.5-4.5 2.5z" fill="currentColor"></path></svg>
            {{c.lessonLabel}}
          </span>
          <span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="{{c.starFill}}" stroke="#D08A00" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9Z"></path></svg>
            {{c.rateLabel}}
          </span>
        </div>
        <sc-if value="{{isMine}}" hint-placeholder-val="{{ false }}">
          <div class="next">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#556070" stroke-width="2" stroke-linecap="round" style="flex:none;margin-top:1px"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
            <span>{{c.nextPrefix}} <b>{{c.nextTitle}}</b></span>
          </div>
          <div class="prow">
            <div class="bar" role="progressbar" aria-label="{{c.title}} progress" aria-valuenow="{{c.progress}}" aria-valuemin="0" aria-valuemax="100"><i style="width:{{c.pct}};background:{{c.barColor}}"></i></div>
            <span>{{c.pct}} complete</span>
          </div>
        </sc-if>
        <div class="cfoot">
          <sc-if value="{{isMine}}" hint-placeholder-val="{{ false }}">
            <button class="btn g" onClick="{{c.open}}" style="padding-left:8px;padding-right:8px">Course details</button>
            <button class="btn p" onClick="{{c.resume}}" style="margin-left:auto">{{c.cta}}</button>
          </sc-if>
          <sc-if value="{{isAll}}" hint-placeholder-val="{{ true }}">
            <button class="btn s" onClick="{{c.open}}" style="width:100%">View course</button>
          </sc-if>
        </div>
      </div>
    </article>
    </sc-for>
  </div>
  </sc-if>

  <sc-if value="{{noResults}}" hint-placeholder-val="{{ false }}">
  <div class="empty">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#8D9AB0" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    <div style="font-size:16px;font-weight:600">{{emptyTitle}}</div>
    <div style="color:#556070">{{emptyHint}}</div>
    <button class="btn s" onClick="{{resetList}}">Show all courses</button>
  </div>
  </sc-if>
</div>
</sc-if>

<!-- ============ COURSE DETAIL ============ -->
<sc-if value="{{isDetail}}" hint-placeholder-val="{{ false }}">
<div class="wrap">
  <div class="topnav">
    <span class="navctx">My courses</span>
    <button class="btn s" onClick="{{goCourses}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>
      Back
    </button>
  </div>

  <section class="hero">
    <div class="mono" style="background:{{cur.hue}};width:72px;height:72px;font-size:26px" aria-hidden="true">{{cur.mono}}</div>
    <div>
      <h1 class="h1">{{cur.title}}</h1>
      <div class="meta">
        <span class="chip">{{cur.level}}</span>
        <span class="rate">
          <span class="stars" aria-hidden="true">
            <sc-for list="{{cur.stars}}" as="s" hint-placeholder-count="5">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="{{s.fill}}" stroke="#D08A00" stroke-width="1.6" stroke-linejoin="round"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9Z"></path></svg>
            </sc-for>
          </span>
          {{cur.rateLabel}}
        </span>
        <span class="rate">{{cur.lessonLabel}}</span>
      </div>
    </div>
    <div class="side">
      <div class="prow" style="justify-content:space-between"><span>Course progress</span><b style="color:#121826">{{cur.pct}}</b></div>
      <div class="bar" role="progressbar" aria-label="Course progress" aria-valuenow="{{cur.progress}}" aria-valuemin="0" aria-valuemax="100" style="flex:none"><i style="width:{{cur.pct}}"></i></div>
      <button class="btn p" onClick="{{resumeCur}}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
        {{cur.cta}}
      </button>
    </div>
  </section>

  <section aria-labelledby="content-sec-h" style="display:flex;flex-direction:column;gap:12px">
    <div class="pathhead">
      <div>
        <h2 class="h2" id="content-sec-h" style="font-size:19px">Course content</h2>
        <span class="lvmeta">{{cur.secSummary}}</span>
      </div>
      <button class="btn g sm" onClick="{{toggleAllSec}}">{{toggleAllSecLabel}}</button>
    </div>

  <section class="panel" aria-labelledby="review-h">

  </sc-if>
</div>
</sc-if>

<script>
/* Minimal standalone runtime for the exported prototypes (templates + logic class). */
(function () {
  var TABLE_TAGS = /<(\/?)(table|thead|tbody|tfoot|tr|td|th|select|option|optgroup)(?=[\s>\/])/gi;
  var HOLE = /\{\{\s*([^}]*?)\s*\}\}/g;
  var BOOL_ATTRS = { disabled: 1, checked: 1, selected: 1, hidden: 1, readonly: 1, required: 1, open: 1 };
  function lookup(expr, scopes) {
    expr = expr.trim();
    if (expr === 'true') return true;
    if (expr === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(expr)) return Number(expr);
    var parts = expr.split('.');
    for (var i = scopes.length - 1; i >= 0; i--) {
      var sc = scopes[i];
      if (sc && Object.prototype.hasOwnProperty.call(sc, parts[0])) {
        var v = sc[parts[0]];
        for (var j = 1; j < parts.length; j++) { if (v == null) return undefined; v = v[parts[j]]; }
        return v;
      }
    }
    return undefined;
  }
  function interp(str, scopes) {
    return str.replace(HOLE, function (_, e) { var v = lookup(e, scopes); return v == null ? '' : String(v); });
  }
  function single(str) { var m = /^\s*\{\{\s*([^}]*?)\s*\}\}\s*$/.exec(str); return m ? m[1] : null; }
  function eventName(attr, el) {
    var n = attr.slice(2).toLowerCase();
    if (n === 'change') {
      var tag = el.localName, type = (el.getAttribute('type') || '').toLowerCase();
      if (tag === 'textarea' || (tag === 'input' && type !== 'checkbox' && type !== 'radio')) return 'input';
      return 'change';
    }
    return n;
  }
  function build(node, scopes, out) {
    if (node.nodeType === 3) { out.push(document.createTextNode(node.data.indexOf('{{') > -1 ? interp(node.data, scopes) : node.data)); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'sc-if') {
      var e = single(node.getAttribute('value') || '');
      if (e != null && lookup(e, scopes)) { for (var c = node.firstChild; c; c = c.nextSibling) build(c, scopes, out); }
      return;
    }
    if (tag === 'sc-for') {
      var le = single(node.getAttribute('list') || ''), as = node.getAttribute('as') || 'item';
      var list = le != null ? lookup(le, scopes) : null;
      (list || []).forEach(function (item, idx) {
        var s = {}; s[as] = item; s.$index = idx;
        var ns = scopes.concat([s]);
        for (var c2 = node.firstChild; c2; c2 = c2.nextSibling) build(c2, ns, out);
      });
      return;
    }
    var el;
    if (tag.indexOf('dc-') === 0) el = document.createElement(tag.slice(3));
    else el = document.importNode(node, false);
    // reset attributes from the template
    var attrs = Array.prototype.slice.call(node.attributes);
    if (tag.indexOf('dc-') !== 0) attrs.forEach(function (a) { el.removeAttribute(a.name); });
    el.__h = {};
    attrs.forEach(function (a) {
      var name = a.name, val = a.value;
      if (name.indexOf('hint-') === 0) return;
      if (name.indexOf('on') === 0 && val.indexOf('{{') > -1) {
        var fe = single(val); var fn = fe != null ? lookup(fe, scopes) : null;
        if (typeof fn === 'function') el.__h[eventName(name, el)] = fn;
        return;
      }
      if (val.indexOf('{{') < 0) { el.setAttribute(name, val); return; }
      var se = single(val);
      if (se != null) {

        resume: function () { self.setState({ screen: 'player', rl: roleIdx, lv: li, lesson: allDone ? 0 : firstOpen, playing: false }); },
        lessons: l.lessons.map(function (x, i) {
          return { n: i + 1, title: x.title, pct: x.progress + '%', status: self.lessonStatus(x), numCls: x.progress > 0 ? 'go' : '',
            barColor: x.progress >= 100 ? '#16A34A' : '#1F4FD1',
            play: function () { self.setState({ screen: 'player', rl: roleIdx, lv: li, lesson: i, playing: false }); } };
        }),
        asgs: asgList, hasAsg: asgList.length > 0
      };
    });
    var selLv = levels[selIdx] || levels[0];
    var allOpen = levels.length > 0 && levels.every(function (x) { return x.open; });
    var toggleAllSec = function () { var o = { _first: firstOpenSec }; if (!allOpen) levels.forEach(function (x, i) { o[i] = true; }); var m = Object.assign({}, s.secOpen || {}); m[cur.id] = o; self.setState({ secOpen: m }); };

    // ---- Player: current role + level track ----
    var rl = cur.roles[s.rl] ? s.rl : cur.go.ri;
    var lvI = cur.roles[rl].levels[s.lv] ? s.lv : 0;
    var track = cur.roles[rl].levels[lvI];
    var tLessons = track.lessons.length ? track.lessons : [{ title: '[Video title]', progress: 0 }];
    var trackLabel = track.name;
    var li = Math.min(s.lesson || 0, tLessons.length - 1);
    var curLessons = tLessons.map(function (l, i) {
      return {
        n: i + 1, title: l.title, pct: l.progress + '%', status: self.lessonStatus(l),
        numCls: l.progress > 0 ? 'go' : '', curCls: i === li ? 'cur' : '', ariaCur: i === li ? 'true' : 'false',
        play: function () { self.setState({ screen: 'player', lesson: i, playing: false }); }
      };
    });
    var lesson = Object.assign({}, curLessons[li], { time: tLessons[li].time || '0:00 / [duration]' });
    var asgs = track.assignments.map(function (a) { return makeAsg(rl, lvI, a, 'player'); });

    // ---- Assignment ----
    var qv = { dots: [], options: [], review: [] };
    var qz = s.quiz;
    var qa = null, qk = null;
    if (s.screen === 'quiz' && qz) {
      qk = qz.key.split(':');
      var qRole = cur.roles[+qk[1]];
      var qLv = qRole && qRole.levels[+qk[2]];
      qa = qLv ? (qLv.assignments.filter(function (a) { return a.id === qk[3]; })[0] || null) : null;
    }
    if (qa) {
      var total = qa.questions.length, qi = qz.q, qq = qa.questions[qi];
      var answered = Object.keys(qz.answers).length;
      var correct = qa.questions.filter(function (x, i) { return qz.answers[i] === x.correct; }).length;
      var score = Math.round(correct / total * 100);
      var passed = score >= qa.pass;
      var fromDetail = qz.from === 'level';
      var setQ = function (patch) { self.setState({ quiz: Object.assign({}, qz, patch) }); };
      qv = {
        title: qa.title, pass: qa.pass + '%', total: total, n: qi + 1, required: qa.required,
        answeredNum: answered, progressPct: Math.round(answered / total * 100) + '%', answeredLabel: answered + ' of ' + total + ' answered',
        text: qq.text,
        options: qq.options.map(function (o, oi) {
          var sel = qz.answers[qi] === oi;
          return { text: o, letter: 'ABCD'.charAt(oi), id: 'q' + qi + 'o' + oi, checked: sel, cls: sel ? 'sel' : '',
            pick: function () { var a = Object.assign({}, qz.answers); a[qi] = oi; setQ({ answers: a, error: false }); } };
        }),
        dots: qa.questions.map(function (x, i) {
          var done = qz.answers[i] !== undefined;
          return { n: i + 1, cls: (i === qi ? 'cur ' : '') + (done ? 'done' : ''), label: 'Question ' + (i + 1) + (done ? ', answered' : ', not answered'), go: function () { setQ({ q: i, error: false }); } };
        }),
        error: qz.error, isFirst: qi === 0, isLast: qi === total - 1, notLast: qi < total - 1,
        prev: function () { setQ({ q: Math.max(0, qi - 1), error: false }); },
        next: function () { if (qz.answers[qi] === undefined) { setQ({ error: true }); return; } setQ({ q: qi + 1, error: false }); },
        submit: function () {
          var missing = -1;
          for (var i = 0; i < total; i++) { if (qz.answers[i] === undefined) { missing = i; break; } }
          if (missing > -1) { setQ({ q: missing, error: true }); return; }
          var res = Object.assign({}, results); res[qz.key] = { score: score, passed: passed, answers: qz.answers };
          self.setState({ results: res, quiz: Object.assign({}, qz, { submitted: true, error: false }) });
        },
        answering: !qz.submitted, submitted: !!qz.submitted,
        score: score + '%', correct: correct, passed: passed, failed: !passed,
        resultTitle: passed ? 'You passed the quiz' : 'Not passed yet',
        scoreColor: passed ? '#11643C' : '#9B1C12',
        review: qa.questions.map(function (x, i) {
          var ok = qz.answers[i] === x.correct;
          return { n: i + 1, text: x.text, ok: ok, bad: !ok, showRight: !ok && passed, yours: x.options[qz.answers[i]] || 'No answer', right: x.options[x.correct] };
        }),
        exitLabel: fromDetail ? 'Back to course' : 'Back to video',
        retake: function () { self.setState({ quiz: Object.assign({}, qz, { q: 0, answers: {}, error: false, submitted: false }) }); },
        exit: function () { self.setState({ screen: fromDetail ? 'detail' : 'player' }); },
        watch: function () { self.setState({ screen: 'player', playing: false }); }
      };
    }
    var goTrack = function () { var m = Object.assign({}, s.lvSel || {}); m[cur.id] = lvI; self.setState({ screen: 'detail', lvSel: m }); };
    return {
      isList: s.screen === 'list', isDetail: s.screen === 'detail', isLevel: s.screen === 'level', isPlayer: s.screen === 'player',
      isAll: s.tab === 'all', isMine: s.tab === 'mine',
      allCls: s.tab === 'all' ? 'on' : '', myCls: s.tab === 'mine' ? 'on' : '',
      allSel: s.tab === 'all' ? 'true' : 'false', mySel: s.tab === 'mine' ? 'true' : 'false',
      totalCount: all.length, mineCount: mine.length,
      showAll: function () { self.setState({ tab: 'all' }); },
      showMine: function () { self.setState({ tab: 'mine', filter: 'progress' }); },
      query: s.query, hasQuery: q.length > 0,
      onQuery: function (e) { self.setState({ query: e.target.value }); },
      clearQuery: function () { self.setState({ query: '' }); },
      visible: visible, hasResults: visible.length > 0, noResults: visible.length === 0,
      filters: filters, resumeC: resumeC || all[0], hasResume: !!resumeC,
      ov: (function () {
        var avg = mine.length ? Math.round(mine.reduce(function (t, c) { return t + c.progress; }, 0) / mine.length) : 0;
        var doneN = mine.filter(function (c) { return c.statusKey === 'done'; }).length;
        var inProg = mine.filter(function (c) { return c.statusKey === 'progress'; }).sort(function (a, b) { return b.progress - a.progress; });
        var progN = inProg.length, newN = mine.length - doneN - progN;
        return {
          pct: avg + '%', dash: (avg / 100 * 2 * Math.PI * 44).toFixed(1),
          summary: doneN + ' of ' + mine.length + (mine.length === 1 ? ' course' : ' courses') + ' completed',
          done: doneN, prog: progN, notStarted: newN,
          wDone: (mine.length ? doneN / mine.length * 100 : 0) + '%',
          wProg: (mine.length ? progN / mine.length * 100 : 0) + '%',
          wNew: (mine.length ? newN / mine.length * 100 : 0) + '%',
          top: inProg.slice(0, 3).map(function (c) { return { title: c.title, pct: c.progress + '%', open: c.open }; }),
          hasProg: inProg.length > 0, more: Math.max(0, inProg.length - 3), hasMore: inProg.length > 3,
          seeMore: function () { self.goToList('progress'); },
          viewAll: function () { self.goToList('any'); }
        };
      })(),
      statEnrolled: mine.length, statProg: cnt('progress'), statDone: cnt('done'),
      statPassed: Object.keys(s.results || {}).filter(function (k) { return s.results[k].passed; }).length,
      countLabel: visible.length + (visible.length === 1 ? ' course' : ' courses'),
      sortVal: s.sort, onSort: function (e) { self.setState({ sort: e.target.value }); },
      emptyTitle: q ? 'No courses match "' + s.query.trim() + '"' : 'No courses in this list yet',
      emptyHint: q ? 'Check the spelling or search by app name, like Plum POS or Schedules.' : 'Courses you start or finish will show up here.',
      resetList: function () { self.setState({ query: '', filter: 'any' }); },
      goCourses: function () { self.setState({ screen: 'list' }); },
      goDetail: function () { self.setState({ screen: 'detail' }); },
      goTrack: goTrack,
      listFlashCls: s.listFlash ? 'listflash' : '',
      cur: cur, levels: levels, selLv: selLv, toggleAllSec: toggleAllSec, toggleAllSecLabel: allOpen ? 'Collapse all' : 'Expand all',
      curLessons: curLessons, curCount: tLessons.length, trackLabel: trackLabel,
      resumeCur: cur.play,
      lesson: lesson,
      paused: !s.playing, playing: s.playing, playLabel: s.playing ? 'Pause video' : 'Play video',
      togglePlay: function () { self.toggleWeb(); },
      hasToast: !!s.toast, toast: s.toast,
      noPrev: li === 0, noNext: li >= tLessons.length - 1,
      isQuiz: s.screen === 'quiz' && !!qa, asgs: asgs, hasAsg: asgs.length > 0, noAsg: asgs.length === 0, qv: qv,
      asgCountLabel: asgs.length === 1 ? '1 quiz' : asgs.length + ' quizzes',
      prev: function () { self.setState({ lesson: Math.max(0, li - 1), playing: false }); },
      next: function () { self.setState({ lesson: Math.min(tLessons.length - 1, li + 1), playing: false }); }
    };
  }
}

DC.mount(Component, document.getElementById('dc-root'), document.getElementById('dc-src').textContent);
